<svg xmlns="http://www.w3.org/2000/svg" width="896" height="220" viewBox="0 0 896 220" role="img" aria-label="Kevin Austria Galvan — Desarrollador Full-Stack">
  <defs>
    <linearGradient id="lineGradEsL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0"/>
      <stop offset="40%" stop-color="#1E3A8A" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#E23636" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E23636" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowEsL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="896" height="220" fill="#f8fafc"/>
  <rect x="48" y="32" width="40" height="1" fill="#1E3A8A" opacity="0.45"/>
  <circle cx="96" cy="32" r="2" fill="#7C3AED" opacity="0.7"/>
  <text x="48" y="58" fill="#475569" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">FULL-STACK · DEVOPS · DATOS</text>
  <text x="48" y="108" fill="#0f172a" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" font-weight="500" letter-spacing="-0.8">Kevin Austria Galvan</text>
  <text x="48" y="138" fill="#475569" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="400">Construyo software real, de la idea hasta producción.</text>
  <text x="48" y="168" fill="#0f172a" opacity="0.5" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" letter-spacing="0.5">Español nativo · Inglés básico</text>
  <line x1="48" y1="192" x2="848" y2="192" stroke="rgba(30,58,138,0.15)" stroke-width="1"/>
  <line x1="48" y1="192" x2="848" y2="192" stroke="url(#lineGradEsL)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="160 688" filter="url(#glowEsL)">
    <animate attributeName="stroke-dashoffset" values="848;0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="opacity" values="0.5;0.88;0.5" dur="2.4s" repeatCount="indefinite"/>
  </line>
</svg>