<svg xmlns="http://www.w3.org/2000/svg" width="896" height="220" viewBox="0 0 896 220" role="img" aria-label="Kevin Austria Galvan — Full-Stack Developer">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0"/>
      <stop offset="45%" stop-color="#14b8a6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="896" height="220" fill="#0a0a0a" rx="0"/>
  <rect x="48" y="32" width="48" height="1" fill="#E8E6DC" opacity="0.35"/>
  <text x="48" y="58" fill="#E8E6DC" opacity="0.5" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="600" letter-spacing="2.4">FULL-STACK · DEVOPS · DATA</text>
  <text x="48" y="108" fill="#E8E6DC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" font-weight="500" letter-spacing="-0.8">Kevin Austria Galvan</text>
  <text x="48" y="138" fill="#9a9a9a" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="400">Building real-world software from idea to production.</text>
  <text x="48" y="168" fill="#E8E6DC" opacity="0.42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" letter-spacing="0.5">Español nativo · Inglés básico</text>
  <line x1="48" y1="192" x2="848" y2="192" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="48" y1="192" x2="848" y2="192" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="160 688" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="848;0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="2.4s" repeatCount="indefinite"/>
  </line>
</svg>