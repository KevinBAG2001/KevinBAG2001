<svg xmlns="http://www.w3.org/2000/svg" width="896" height="220" viewBox="0 0 896 220" role="img" aria-label="Kevin Austria Galvan — Full-Stack Developer">
  <defs>
    <linearGradient id="lineGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0f766e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="896" height="220" fill="#f7f5f0"/>
  <rect x="48" y="32" width="48" height="1" fill="#111411" opacity="0.28"/>
  <text x="48" y="58" fill="#3d423c" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="600" letter-spacing="2.4">FULL-STACK · DEVOPS · DATA</text>
  <text x="48" y="108" fill="#111411" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="32" font-weight="500" letter-spacing="-0.8">Kevin Austria Galvan</text>
  <text x="48" y="138" fill="#6F6F6F" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="400">Building real-world software from idea to production.</text>
  <text x="48" y="168" fill="#111411" opacity="0.5" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" letter-spacing="0.5">Español nativo · Inglés básico</text>
  <line x1="48" y1="192" x2="848" y2="192" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <line x1="48" y1="192" x2="848" y2="192" stroke="url(#lineGradL)" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="160 688" filter="url(#glowL)">
    <animate attributeName="stroke-dashoffset" values="848;0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </line>
</svg>